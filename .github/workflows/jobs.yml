name: job-search

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:         # кнопка ручного запуска

permissions:
  contents: write            # чтобы можно было коммитить файл с результатами

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Установить Poetry и зависимости
        run: |
          pipx install poetry
          poetry install --no-root

      - name: Запустить скрипт
        run: poetry run python the_very_new_fighting_429.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Сохранить файл с результатами в репозиторий
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add descriptions.docx
          git commit -m "results $(date -I)" || echo "нет изменений"
          git pull --rebase
          git push
