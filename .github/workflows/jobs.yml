name: job-search

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:         # кнопка ручного запуска

permissions:
  contents: write            # чтобы можно было коммитить файл с результатами

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Установить Poetry и зависимости
        run: |
          pipx install poetry
          poetry install --no-root

      - name: Запустить скрипт
        run: poetry run python the_very_new_fighting_429.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Сохранить результаты в репозиторий
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vacancies.csv seen_jobs.json pending_jobs.json
          if git diff --cached --quiet; then
            echo "Изменений нет — коммитить нечего"
          else
            git commit -m "results $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
